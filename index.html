<script>

/* ---------- login ---------- */
function showLogin(){$('#app').innerHTML=`<div id="login"><h2 style="font-size:24px;margin-bottom:16px">HLM <span style="color:var(--or)">LOGISTICS</span></h2><div class="c"><label>E-mail<input id="em" type="email" autocomplete="username"></label><label>Senha<input id="pw" type="password" autocomplete="current-password"></label><button onclick="login()" style="width:100%">Entrar</button><button class="s" onclick="signup()" style="width:100%;margin-top:8px">Criar conta (tenho convite)</button><p id="le" class="neg"></p></div></div>`}

 const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)return $('#le').textContent=error.message;
 if(data.session)boot();else $('#le').textContent='Conta criada. Confirme o e-mail recebido, depois entre aqui e informe o código de convite.'}
function showClaim(){$('#app').innerHTML=`<div id="login"><h2 style="font-size:24px;margin-bottom:16px">HLM <span style="color:var(--or)">LOGISTICS</span></h2><div class="c"><p>Sua conta ainda não está vinculada a uma empresa. Digite o código de convite que o proprietário te passou.</p><label>Seu nome<input id="cn"></label><label>Código de convite<input id="cc"></label><button onclick="claim()" style="width:100%">Entrar na empresa</button><button class="s" onclick="logout()" style="width:100%;margin-top:8px">Sair</button></div></div>`}

 const{data:{user}}=await sb.auth.getUser();if(!user)return showLogin();
 const{data:p,error}=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();
 if(error)return alert(error.message);if(!p)return showClaim();

async function load(){
 const t=(n,o)=>{let q=sb.from(n).select('*');return o?q.order(o[0],{ascending:o[1]}):q};
 const r=await Promise.all([t('cities',['name',true]),t('vehicles',['code',true]),t('drivers',['name',true]),t('orders',['number',false]),t('fin_entries',['entry_date',false]),sb.from('companies').select('*').single(),t('maintenances',['done_on',false]),t('profiles'),t('invites',['created_at',false]),t('fuel_logs',['odometer_km',true])]);
 if(r.slice(0,7).some(x=>err(x.error)))return;[S.cities,S.vehicles,S.drivers,S.orders,S.fin]=r.slice(0,5).map(x=>x.data);S.co=r[5].data;S.maint=r[6].data;S.prof=r[7].data||[];S.inv=r[8].data||[];S.fuel=r[9].data||[]}

function form(title,fields,ok,vals){vals=vals||{};
 const d=$('#dlg');
 d.innerHTML=`<div style="padding:14px"><h2>${title}</h2><br>${fields.map(([k,l,t,o])=>`<label>${l}${t=='sel'?`<select name="${k}">${o.map(([v,x])=>`<option value="${esc(v)}" ${String(vals[k]??'')==String(v)?'selected':''}>${esc(x)}</option>`).join('')}</select>`:t=='area'?`<textarea name="${k}">${esc(vals[k])}</textarea>`:`<input name="${k}" type="${t||'text'}" step="any" value="${esc(vals[k]??(t=='date'?today():''))}">`}</label>`).join('')}<div class="bar"><button class="s" id="x">Cancelar</button><button id="ok">Salvar</button></div></div>`;
 d.showModal();$('#x').onclick=()=>d.close();
 $('#ok').onclick=async()=>{const v={};for(const[k,l,t]of fields){let x=d.querySelector(`[name=${k}]`).value.trim();
  if(t=='number'){x=parseFloat(x);if(isNaN(x)||x<0)return alert(l+': informe um número válido')}else if(!x&&t!='area'&&t!='sel')return alert(l+' é obrigatório');
  v[k]=x===''?null:x}
  $('#ok').disabled=true;if(await ok(v)===false){$('#ok').disabled=false;return}d.close();await load();render()}}
async function ins(table,row){const{error}=await sb.from(table).insert({...row,company_id:S.cid});return !err(error)}
const opt=(a,f)=>[['','—'],...a.map(f)];

/* ---------- ações ---------- */

 return[['origin_id','Origem','sel',cs],['dest_id','Destino','sel',cs],['cargo_type','Tipo de mercadoria'],['weight_t','Peso (t)','number'],['freight_value','Valor do frete (R$)','number'],['distance_km','Distância (km)','number'],['vehicle_id','Caminhão','sel',opt(S.vehicles,v=>[v.id,v.code])],['driver_id','Motorista','sel',opt(S.drivers,d=>[d.id,d.name])],['trip_expenses','Despesas da viagem (R$): 0 = estimar automático','number'],['status','Status','sel',['aguardando_carregamento','aguardando_motorista','em_andamento','em_pausa','ocorrencia'].map(k=>[k,ST[k]])],['notes','Observações','area']]}
function novaOrdem(){if(S.cities.length<2)return alert('Cadastre ao menos 2 cidades na aba Cidades antes de criar ordens.');form('Nova ordem de serviço',ordFields(),v=>salvaOrdem(v))}
function editaOrdem(id){const o=S.orders.find(x=>x.id==id);form('Editar ordem #'+o.number,ordFields(),async v=>{if(v.trip_expenses==0){const e=estima(v);if(e)v.trip_expenses=Math.round(e.total*100)/100}const{error}=await sb.from('orders').update(v).eq('id',id);return !err(error)},o)}
async function mudaStatus(id,st){const{error}=await sb.from('orders').update({status:st}).eq('id',id);if(!err(error)){await load();render()}}
async function finalizar(id){if(!confirm('Finalizar entrega? Isso lança receita, despesas e comissão no financeiro.'))return;
 const{error}=await sb.from('orders').update({status:'entregue',delivered_at:new Date().toISOString()}).eq('id',id);if(err(error))return;
 const o=S.orders.find(x=>x.id==id),d=S.drivers.find(x=>x.id==o.driver_id);
 if(d&&d.commission_pct>0){const{error:e2}=await sb.from('fin_entries').upsert({company_id:S.cid,kind:'despesa',category:'Salários',description:'Comissão '+d.name+' ordem #'+o.number,amount:Math.round(o.freight_value*d.commission_pct)/100,paid_at:today(),order_id:id,vehicle_id:o.vehicle_id,auto_key:'order:'+id+':comissao'},{onConflict:'company_id,auto_key',ignoreDuplicates:true});err(e2)}
 await load();render()}
async function cancelar(id){const j=prompt('Justificativa do cancelamento:');if(!j)return;
 let r=await sb.from('orders').update({status:'cancelada',cancel_reason:j}).eq('id',id);if(err(r.error))return;
 r=await sb.from('fin_entries').update({cancelled:true,cancel_reason:j}).eq('order_id',id);err(r.error);await load();render()}
const CR=['Fretes','Contratos','Serviços adicionais','Outros recebimentos'],CD=['Diesel','Pedágios','Salários','Manutenção','Pneus','Alimentação','Hospedagem','Financiamentos','Impostos fictícios','Multas','Outros gastos'];

function novoLanc(){form('Novo lançamento',[['kind','Tipo','sel',[['receita','Receita'],['despesa','Despesa']]],['category','Categoria','sel',so([...CR,...CD])],['description','Descrição'],['amount','Valor (R$)','number'],['entry_date','Data','date'],['sit','Situação','sel',[['pago','Pago/Recebido'],['pendente','Pendente']]]],v=>{const sit=v.sit;delete v.sit;return ins('fin_entries',{...v,paid_at:sit=='pago'?v.entry_date:null})})}
async function baixa(id){const{error}=await sb.from('fin_entries').update({paid_at:today()}).eq('id',id);if(!err(error)){await load();render()}}
async function cancLanc(id){const j=prompt('Justificativa:');if(!j)return;const{error}=await sb.from('fin_entries').update({cancelled:true,cancel_reason:j}).eq('id',id);if(!err(error)){await load();render()}}
function novoCam(){form('Novo caminhão',[['code','Identificador'],['brand','Marca'],['model','Modelo'],['year','Ano','number'],['odometer_km','Quilometragem','number'],['avg_consumption','Consumo médio (km/l)','number'],['acquisition_value','Valor de aquisição (R$)','number'],['acquired_on','Data de aquisição','date'],['status','Situação','sel',so(['disponivel','em_viagem','em_manutencao','financiado','vendido','inativo']).map(([v])=>[v,v.replace('_',' ')])]],v=>ins('vehicles',v))}
function novoMot(){form('Novo motorista',[['name','Nome / identificador'],['role_title','Cargo'],['salary','Salário (R$)','number'],['commission_pct','Comissão (%)','number'],['license_cat','Categoria CNH (simulação)']],v=>ins('drivers',v))}
function novaCid(){form('Nova cidade',[['name','Cidade'],['uf','UF'],['region','Região','sel',so(['Norte','Nordeste','Centro-Oeste','Sudeste','Sul'])]],v=>{v.uf=v.uf.toUpperCase().slice(0,2);return ins('cities',v)})}
function impCSV(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
 const rows=[];r.result.split(/\r?\n/).forEach((l,i)=>{const[c,u,g]=l.split(/[;,]/).map(x=>x.trim());if(!c||!u||u.length!=2||(i==0&&/cidade|nome/i.test(c)))return;rows.push({company_id:S.cid,name:c,uf:u.toUpperCase(),region:g||null})});
 const{error}=await sb.from('cities').upsert(rows,{onConflict:'company_id,name,uf',ignoreDuplicates:true});if(err(error))return;alert(rows.length+' linhas processadas');await load();render()};r.readAsText(f)}
async function salvaCap(){const v=parseFloat($('#cap').value);if(isNaN(v)||v<0)return alert('Valor inválido');const{error}=await sb.from('companies').update({initial_capital:v}).eq('id',S.cid);if(!err(error)){await load();render()}}

/* ---------- realismo: estimativa, comissão, manutenção ---------- */
const com=o=>{const d=S.drivers.find(x=>x.id==o.driver_id);return d?o.freight_value*d.commission_pct/100:0};
function estima(v){const c=S.vehicles.find(x=>x.id==v.vehicle_id),st=S.co.settings||{},dp=Number(st.diesel_price??6),tk=Number(st.toll_per_km??0);
 if(!c||!c.avg_consumption||!v.distance_km)return null;const diesel=v.distance_km/c.avg_consumption*dp,toll=v.distance_km*tk;return{diesel,toll,total:diesel+toll}}
async function salvaOrdem(v){let msg='';if(v.trip_expenses==0){const e=estima(v);if(e){v.trip_expenses=Math.round(e.total*100)/100;msg='Despesas estimadas: diesel '+R(e.diesel)+' + pedágio '+R(e.toll)+' = '+R(e.total)}else msg='Sem estimativa (precisa de caminhão com consumo e distância). Despesas ficaram em R$ 0.'}
 const ok=await ins('orders',v);if(ok&&msg)alert(msg);return ok}
const MK=['Troca de óleo','Pneus','Freios','Motor','Transmissão','Suspensão','Reparos gerais','Avaria','Lavagem'],MARG=2000;
function novaMan(){if(!S.vehicles.length)return alert('Cadastre um caminhão primeiro.');
 form('Registrar manutenção',[['vehicle_id','Caminhão','sel',S.vehicles.map(v=>[v.id,v.code+' ('+Number(v.odometer_km).toLocaleString('pt-BR')+' km)'])],['kind','Serviço','sel',so(MK)],['kind_type','Tipo','sel',[['preventiva','Preventiva'],['corretiva','Corretiva']]],['done_on','Data','date'],['odometer_km','Quilometragem','number'],['cost','Valor (R$)','number'],['shop','Oficina'],['interval','Próxima em (km, 0 = sem alerta)','number'],['notes','Observações','area']],async v=>{
  const{kind_type,interval,...m}=v;m.preventive=kind_type=='preventiva';m.description=m.kind;m.next_due_km=interval>0?m.odometer_km+interval:null;
  if(m.cost>0){const vc=S.vehicles.find(x=>x.id==m.vehicle_id);const{data,error}=await sb.from('fin_entries').insert({company_id:S.cid,kind:'despesa',category:'Manutenção',description:m.kind+' - '+(vc?vc.code:''),amount:m.cost,entry_date:m.done_on,paid_at:m.done_on,vehicle_id:m.vehicle_id}).select('id').single();if(err(error))return false;m.fin_entry_id=data.id}
  return ins('maintenances',m)})}
function alertas(){const out=[];S.vehicles.forEach(v=>{const last={};S.maint.filter(m=>m.vehicle_id==v.id).forEach(m=>{if(!last[m.kind]||m.done_on>last[m.kind].done_on)last[m.kind]=m});
 Object.values(last).forEach(m=>{if(!m.next_due_km)return;const f=m.next_due_km-v.odometer_km;if(f<=MARG)out.push({v,m,f})})});return out.sort((a,b)=>a.f-b.f)}
const alTxt=x=>esc(x.v.code)+': '+esc(x.m.kind)+' · '+(x.f<=0?'<span class="neg">vencida há '+Math.abs(Math.round(x.f)).toLocaleString('pt-BR')+' km</span>':'faltam '+Math.round(x.f).toLocaleString('pt-BR')+' km');

/* ---------- equipe, abastecimento, financiamentos, depreciação ---------- */
async function novoConvite(){form('Novo convite',[['role','Perfil','sel',[['motorista','Motorista'],['gerente','Gerente'],['financeiro','Financeiro'],['administrador','Administrador']]],['driver_id','Vincular a motorista cadastrado (opcional)','sel',opt(S.drivers.filter(d=>!d.user_id),d=>[d.id,d.name])]],async v=>{
 const{data,error}=await sb.from('invites').insert({...v,company_id:S.cid}).select('code').single();if(err(error))return false;alert('Código do convite: '+data.code+'\nPasse ao funcionário: ele cria a conta no site e digita esse código.')})}
function consVeic(vid){const L=S.fuel.filter(f=>f.vehicle_id==vid&&f.odometer_km!=null).sort((a,b)=>a.odometer_km-b.odometer_km);if(L.length<2)return null;
 const km=Number(L[L.length-1].odometer_km)-Number(L[0].odometer_km),lt=L.slice(1).reduce((s,f)=>s+Number(f.liters),0),cs=L.slice(1).reduce((s,f)=>s+Number(f.total),0);return km>0&&lt>0?{km,lt,kml:km/lt,ckm:cs/km}:null}
function novoAbast(){if(!S.vehicles.length)return alert('Cadastre um caminhão primeiro.');
 form('Registrar abastecimento',[['vehicle_id','Caminhão','sel',S.vehicles.map(v=>[v.id,v.code])],['driver_id','Motorista','sel',opt(S.drivers,d=>[d.id,d.name])],['liters','Litros','number'],['price_per_liter','Preço por litro (R$)','number'],['odometer_km','Quilometragem atual','number'],['station','Posto'],['fueled_on','Data','date']],async v=>{
  const vc=S.vehicles.find(x=>x.id==v.vehicle_id);
  const{error}=await sb.from('fin_entries').insert({company_id:S.cid,kind:'despesa',category:'Diesel',description:'Diesel '+vc.code+' - '+v.station,amount:Math.round(v.liters*v.price_per_liter*100)/100,entry_date:v.fueled_on,paid_at:v.fueled_on,vehicle_id:v.vehicle_id});if(err(error))return false;
  if(!await ins('fuel_logs',v))return false;
  await load();const c=consVeic(v.vehicle_id),up={};if(c)up.avg_consumption=Math.round(c.kml*100)/100;if(v.odometer_km>Number(vc.odometer_km))up.odometer_km=v.odometer_km;
  if(Object.keys(up).length)await sb.from('vehicles').update(up).eq('id',v.vehicle_id)})}
function novoFinanc(){form('Financiamento / empréstimo (simulado)',[['tipo','Tipo','sel',[['fin','Financiamento de veículo'],['emp','Empréstimo (entra dinheiro)']]],['desc','Descrição'],['valor','Valor financiado/emprestado (R$)','number'],['n','Número de parcelas','number'],['juros','Juros ao mês (%)','number'],['venc','Vencimento da 1ª parcela','date'],['vehicle_id','Veículo (opcional)','sel',opt(S.vehicles,v=>[v.id,v.code])]],async v=>{
 const n=Math.round(v.n);if(n<1||n>120)return alert('Parcelas: de 1 a 120')||false;
 const i=v.juros/100,pmt=Math.round((i>0?v.valor*i/(1-Math.pow(1+i,-n)):v.valor/n)*100)/100,uid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())).slice(0,8),rows=[];
 for(let k=1;k<=n;k++){const d=new Date(v.venc+'T12:00:00');d.setMonth(d.getMonth()+k-1);const ds=d.toISOString().slice(0,10);rows.push({company_id:S.cid,kind:'despesa',category:'Financiamentos',description:'Parcela '+k+'/'+n+' - '+v.desc,amount:pmt,entry_date:ds,due_date:ds,installment_no:k,vehicle_id:v.vehicle_id,auto_key:'fin:'+uid+':'+k})}
 if(v.tipo=='emp')rows.push({company_id:S.cid,kind:'receita',category:'Outros recebimentos',description:'Empréstimo - '+v.desc,amount:v.valor,entry_date:today(),paid_at:today(),auto_key:'fin:'+uid+':0'});
 const{error}=await sb.from('fin_entries').insert(rows);if(err(error))return false;alert(n+' parcelas de '+R(pmt)+' · total '+R(pmt*n))})}
const valorEst=v=>{const r=Number((S.co.settings||{}).depr_year??10)/100,a=Number(v.acquisition_value||0),y=Math.max(0,(Date.now()-new Date(v.acquired_on||Date.now()))/31557600000);return a*Math.pow(1-r,y)};

/* ---------- relatórios ---------- */
let RP={p:'mes',de:'',ate:'',mot:'',cam:'',cid:'',carga:''};
function rango(){const t=new Date(),iso=d=>d.toISOString().slice(0,10),p=RP.p;let de='',ate='';
 if(p=='dia')de=ate=iso(t);else if(p=='semana'){const d=new Date(t);d.setDate(t.getDate()-t.getDay());de=iso(d);ate=iso(t)}
 else if(p=='mes'){de=iso(t).slice(0,7)+'-01';ate=iso(t)}else if(p=='ano'){de=t.getFullYear()+'-01-01';ate=iso(t)}else if(p=='custom'){de=RP.de;ate=RP.ate}
 return[de,ate]}
function relDados(){const[de,ate]=rango();
 const L=S.orders.filter(o=>{if(o.status!='entregue')return false;const d=String(o.delivered_at||o.created_at).slice(0,10);
  return(!de||d>=de)&&(!ate||d<=ate)&&(!RP.mot||o.driver_id==RP.mot)&&(!RP.cam||o.vehicle_id==RP.cam)&&(!RP.cid||o.origin_id==RP.cid||o.dest_id==RP.cid)&&(!RP.carga||o.cargo_type==RP.carga)}).map(o=>{
  const c=com(o),v=S.vehicles.find(x=>x.id==o.vehicle_id),m=S.drivers.find(x=>x.id==o.driver_id);
  return{n:o.number,data:String(o.delivered_at||o.created_at).slice(0,10),orig:city(o.origin_id),dest:city(o.dest_id),carga:o.cargo_type||'',mot:m?m.name:'—',cam:v?v.code:'—',km:Number(o.distance_km||0),frete:Number(o.freight_value),desp:Number(o.trip_expenses),com:c,lucro:Number(o.freight_value)-Number(o.trip_expenses)-c}});
 return{de,ate,L}}
function relTot(L){const f=k=>L.reduce((s,r)=>s+r[k],0),fat=f('frete'),desp=f('desp')+f('com'),km=f('km');return{n:L.length,fat,desp,lucro:fat-desp,km,ckm:km>0?desp/km:0}}
const agr=(L,f)=>{const m={};L.forEach(r=>{const k=f(r);m[k]=m[k]||{k,n:0,lucro:0,frete:0};m[k].n++;m[k].lucro+=r.lucro;m[k].frete+=r.frete});return Object.values(m)};
const perTxt=d=>RP.p=='tudo'?'Todo o período':(d.de?D(d.de):'…')+' a '+(d.ate?D(d.ate):'…');
function expXlsx(){if(!window.XLSX)return alert('A biblioteca de Excel não carregou. Verifique a conexão e recarregue.');
 const d=relDados(),T=relTot(d.L);
 const w1=XLSX.utils.json_to_sheet(d.L.map(r=>({'Nº':r.n,'Data':D(r.data),'Origem':r.orig,'Destino':r.dest,'Carga':r.carga,'Motorista':r.mot,'Caminhão':r.cam,'Km':r.km,'Frete (R$)':r.frete,'Despesas (R$)':r.desp,'Comissão (R$)':r.com,'Lucro (R$)':r.lucro})));
 const w2=XLSX.utils.aoa_to_sheet([['Indicador','Valor'],['Período',perTxt(d)],['Entregas',T.n],['Faturamento (R$)',T.fat],['Despesas (R$)',T.desp],['Lucro líquido (R$)',T.lucro],['Distância (km)',T.km],['Custo por km (R$)',T.ckm]]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w2,'Resumo');XLSX.utils.book_append_sheet(wb,w1,'Entregas');XLSX.writeFile(wb,'HLM-relatorio-'+today()+'.xlsx')}
const fsel=(k,l,a)=>`${l}<select onchange="RP.${k}=this.value;render()"><option value="">Todos</option>${a.map(([v,x])=>`<option value="${esc(v)}" ${RP[k]==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;

/* ---------- telas ---------- */
const act=()=>S.fin.filter(f=>!f.cancelled),sum=(a,k)=>a.filter(f=>f.kind==k).reduce((s,f)=>s+Number(f.amount),0);
const V={
dash(){const a=act(),p=a.filter(f=>f.paid_at),mes=today().slice(0,7),pm=p.filter(f=>f.entry_date.startsWith(mes));
 const fat=sum(pm,'receita'),dsp=sum(pm,'despesa'),saldo=Number(S.co.initial_capital||0)+sum(p,'receita')-sum(p,'despesa');
 const kp=[['Saldo atual',R(saldo)],['Faturamento do mês',R(fat)],['Despesas do mês',R(dsp)],['Lucro do mês',R(fat-dsp)],['Caminhões',S.vehicles.length],['Motoristas',S.drivers.length],['Em andamento',S.orders.filter(o=>o.status=='em_andamento').length],['Entregas concluídas',S.orders.filter(o=>o.status=='entregue').length],['A receber',R(sum(a.filter(f=>!f.paid_at),'receita'))],['A pagar',R(sum(a.filter(f=>!f.paid_at),'despesa'))],['Valor da frota (est.)',R(S.vehicles.filter(v=>!['vendido','inativo'].includes(v.status)).reduce((s,v)=>s+valorEst(v),0))],['Financiamentos em aberto',R(a.filter(f=>!f.paid_at&&f.category=='Financiamentos').reduce((s,f)=>s+Number(f.amount),0))]];
 const ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
 const dt=ms.map(m=>[sum(p.filter(f=>f.entry_date.startsWith(m)),'receita'),sum(p.filter(f=>f.entry_date.startsWith(m)),'despesa')]);const mx=Math.max(1,...dt.flat());
 const ch=dt.map((x,i)=>`<rect x="${i*50+8}" y="${100-x[0]/mx*90}" width="16" height="${x[0]/mx*90}" fill="#ff6a00"/><rect x="${i*50+26}" y="${100-x[1]/mx*90}" width="16" height="${x[1]/mx*90}" fill="#777"/><text x="${i*50+25}" y="114" font-size="9" fill="#999" text-anchor="middle">${ms[i].slice(5)}/${ms[i].slice(2,4)}</text>`).join('');
 const al=alertas().slice(0,5);const mt=`<div class="c"><h2>Próximas manutenções</h2>${al.length?al.map(alTxt).join('<br>'):'<span class="mu">Nenhuma pendente.</span>'}</div>`;
 return`<div class="g">${kp.map(([l,v])=>`<div class="c k"><small>${l}</small><b>${v}</b></div>`).join('')}</div><div class="c"><h2>Receitas <span style="color:#ff6a00">■</span> e despesas <span class="mu">■</span> (6 meses, efetivados)</h2><svg viewBox="0 0 300 120" width="100%">${ch}</svg></div>${mt}<div class="c"><h2>Últimas movimentações</h2>${tbl(['Data','Descrição','Valor'],a.slice(0,6).map(f=>tr([D(f.entry_date),esc(f.description),`<span class="${f.kind=='receita'?'pos':'neg'}">${R(f.amount)}</span>`])))}</div>`},
ordens(){return`<div class="bar"><h2>Central de operações</h2>${S.role=='motorista'?'':'<button onclick="novaOrdem()">+ Nova ordem</button>'}</div>`+tbl(['Nº','Rota','Frete','Lucro','Status',''],S.orders.map(o=>{const v=S.vehicles.find(x=>x.id==o.vehicle_id),d=S.drivers.find(x=>x.id==o.driver_id),fim=['entregue','cancelada'].includes(o.status);
 return tr(['#'+o.number,city(o.origin_id)+' → '+city(o.dest_id)+`<br><small class="mu">${o.distance_km||0} km · ${esc(v?v.code:'sem caminhão')} · ${esc(d?d.name:'sem motorista')}</small>`,R(o.freight_value),R(o.freight_value-o.trip_expenses-com(o)),ST[o.status]+(o.cancel_reason?`<br><small class="mu">${esc(o.cancel_reason)}</small>`:''),fim||S.role=='motorista'?'':(o.status!='em_andamento'?`<button class="s" onclick="mudaStatus('${o.id}','em_andamento')">Iniciar</button> `:'')+`<button class="s" onclick="editaOrdem('${o.id}')">Editar</button> <button class="s" onclick="finalizar('${o.id}')">Finalizar</button> <button class="s" onclick="cancelar('${o.id}')">Cancelar</button>`])}))},
frota(){return`<div class="bar"><h2>Frota</h2><button onclick="novoCam()">+ Caminhão</button></div>`+tbl(['ID','Veículo','Ano','Km','Consumo','Aquisição','Valor est.','Situação'],S.vehicles.map(t=>tr([esc(t.code),esc((t.brand||'')+' '+(t.model||'')),t.year||'',Number(t.odometer_km).toLocaleString('pt-BR'),(t.avg_consumption||'—')+' km/l',R(t.acquisition_value),R(valorEst(t)),t.status.replace('_',' ')])))},
rel(){const d=relDados(),T=relTot(d.L);
 const md=agr(d.L.filter(r=>r.mot!='—'),r=>r.mot).sort((a,b)=>b.lucro-a.lucro),cm=agr(d.L.filter(r=>r.cam!='—'),r=>r.cam).sort((a,b)=>b.lucro-a.lucro),rt=agr(d.L,r=>r.orig+' → '+r.dest).sort((a,b)=>b.n-a.n).slice(0,5);
 const cargas=[...new Set(S.orders.map(o=>o.cargo_type).filter(Boolean))].map(x=>[x,x]);
 const cf=S.vehicles.map(v=>consVeic(v.id)).filter(Boolean),cmed=cf.length?(cf.reduce((s,c)=>s+c.km,0)/cf.reduce((s,c)=>s+c.lt,0)).toFixed(2)+' km/l':'—';const kp=[['Entregas',T.n],['Faturamento',R(T.fat)],['Despesas',R(T.desp)],['Lucro líquido',R(T.lucro)],['Distância',T.km.toLocaleString('pt-BR')+' km'],['Custo por km',R(T.ckm)],['Melhor motorista',md[0]?esc(md[0].k):'—'],['Caminhão mais rentável',cm[0]?esc(cm[0].k):'—'],['Consumo médio (frota)',cmed]];
 return`<div class="pr"><h2>${esc(S.co.name)} · Relatório de entregas</h2><p>Período: ${perTxt(d)}</p></div><div class="bar noprint"><h2>Relatórios</h2><span><button onclick="expXlsx()">Excel</button> <button class="s" onclick="window.print()">PDF</button></span></div>
<div class="c noprint">Período<select onchange="RP.p=this.value;render()">${[['dia','Hoje'],['semana','Esta semana'],['mes','Este mês'],['ano','Este ano'],['tudo','Tudo'],['custom','Personalizado']].map(([v,l])=>`<option value="${v}" ${RP.p==v?'selected':''}>${l}</option>`).join('')}</select>${RP.p=='custom'?`De<input type="date" value="${RP.de}" onchange="RP.de=this.value;render()">Até<input type="date" value="${RP.ate}" onchange="RP.ate=this.value;render()">`:''}${fsel('mot','Motorista',S.drivers.map(x=>[x.id,x.name]))}${fsel('cam','Caminhão',S.vehicles.map(x=>[x.id,x.code]))}${fsel('cid','Cidade (origem ou destino)',S.cities.map(x=>[x.id,x.name+'/'+x.uf]))}${fsel('carga','Tipo de carga',cargas)}<small class="mu">Considera só entregas finalizadas. Para salvar em PDF, toque em PDF e escolha "Salvar como PDF".</small></div>
<div class="g">${kp.map(([l,v])=>`<div class="c k"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
<div class="c"><h2>Rotas mais usadas</h2>${tbl(['Rota','Entregas','Frete','Lucro'],rt.map(x=>tr([esc(x.k),x.n,R(x.frete),R(x.lucro)])))}</div>
<div class="c"><h2>Entregas do período</h2>${tbl(['Nº','Data','Rota','Motorista','Caminhão','Km','Frete','Lucro'],d.L.map(r=>tr(['#'+r.n,D(r.data),esc(r.orig)+' → '+esc(r.dest),esc(r.mot),esc(r.cam),r.km.toLocaleString('pt-BR'),R(r.frete),R(r.lucro)])))}</div>`},
eq(){return`<div class="bar"><h2>Equipe e acessos</h2><button onclick="novoConvite()">+ Convite</button></div><div class="c"><h2>Usuários</h2>${tbl(['Nome','Perfil'],S.prof.map(p=>tr([esc(p.display_name),esc(p.role)])))}</div><div class="c"><h2>Convites</h2>${tbl(['Código','Perfil','Situação'],S.inv.map(i=>tr(['<b>'+esc(i.code)+'</b>',esc(i.role),i.used_by?'Usado':'Aberto'])))}</div><p class="mu">O funcionário abre o site, toca em "Criar conta", confirma o e-mail, entra e digita o código.</p>`},
abs(){return`<div class="bar"><h2>Abastecimento</h2><button onclick="novoAbast()">+ Registrar</button></div><div class="c"><h2>Consumo real por caminhão</h2>${tbl(['Caminhão','Consumo','Custo/km','Base'],S.vehicles.map(v=>{const c=consVeic(v.id);return tr([esc(v.code),c?c.kml.toFixed(2)+' km/l':'—',c?R(c.ckm):'—',c?c.km.toLocaleString('pt-BR')+' km':'precisa de 2+ abastecimentos'])}))}</div>`+tbl(['Data','Caminhão','Litros','R$/L','Total','Km','Posto'],[...S.fuel].sort((a,b)=>String(b.fueled_on).localeCompare(String(a.fueled_on))).map(f=>{const v=S.vehicles.find(x=>x.id==f.vehicle_id);return tr([D(f.fueled_on),esc(v?v.code:'—'),f.liters,R(f.price_per_liter),R(f.total),Number(f.odometer_km||0).toLocaleString('pt-BR'),esc(f.station)])}))},
man(){const al=alertas();return`<div class="bar"><h2>Manutenção</h2><button onclick="novaMan()">+ Registrar</button></div><div class="c"><h2>Alertas (até ${MARG} km do vencimento)</h2>${al.length?al.map(alTxt).join('<br>'):'<span class="mu">Nenhum alerta.</span>'}</div>`+tbl(['Data','Caminhão','Serviço','Km','Valor','Oficina','Próx. km'],S.maint.map(m=>{const v=S.vehicles.find(x=>x.id==m.vehicle_id);return tr([D(m.done_on),esc(v?v.code:'—'),esc(m.kind)+(m.preventive?' (prev.)':''),Number(m.odometer_km).toLocaleString('pt-BR'),R(m.cost),esc(m.shop),m.next_due_km?Number(m.next_due_km).toLocaleString('pt-BR'):'—'])}))},
rh(){return`<div class="bar"><h2>Motoristas</h2><button onclick="novoMot()">+ Motorista</button></div>`+tbl(['Nome','Cargo','Salário','Comissão','CNH','Entregas'],S.drivers.map(d=>tr([esc(d.name),esc(d.role_title),R(d.salary),d.commission_pct+'%',esc(d.license_cat),S.orders.filter(o=>o.driver_id==d.id&&o.status=='entregue').length])))},
fin(){const a=act(),p=a.filter(f=>f.paid_at);return`<div class="bar"><h2>Financeiro</h2><span><button onclick="novoLanc()">+ Lançamento</button> <button class="s" onclick="novoFinanc()">Financiamento</button></span></div><div class="g"><div class="c k"><small>Capital inicial</small><b>${R(S.co.initial_capital)}</b></div><div class="c k"><small>Receita efetivada</small><b>${R(sum(p,'receita'))}</b></div><div class="c k"><small>Despesa efetivada</small><b>${R(sum(p,'despesa'))}</b></div><div class="c k"><small>Resultado</small><b>${R(sum(p,'receita')-sum(p,'despesa'))}</b></div></div>`+tbl(['Data','Descrição','Categoria','Valor','Situação',''],S.fin.map(f=>tr([D(f.entry_date),esc(f.description),esc(f.category),`<span class="${f.kind=='receita'?'pos':'neg'}">${R(f.amount)}</span>`,f.cancelled?'Cancelado: '+esc(f.cancel_reason):f.paid_at?'Efetivado':'Pendente'+(f.due_date?' · venc. '+D(f.due_date):''),f.cancelled?'':(f.paid_at?'':`<button class="s" onclick="baixa('${f.id}')">Baixar</button> `)+`<button class="s" onclick="cancLanc('${f.id}')">Cancelar</button>`])))},
cid(){const u=$('#uf')?$('#uf').value:'';return`<div class="bar"><h2>Cidades (${S.cities.length})</h2><button onclick="novaCid()">+ Cidade</button></div><div class="c">Importar CSV (cidade;UF;região)<input type="file" accept=".csv,.txt" onchange="impCSV(this)"></div><select id="uf" onchange="render()"><option value="">Todos os estados</option>${[...new Set(S.cities.map(c=>c.uf))].sort().map(x=>`<option ${u==x?'selected':''}>${x}</option>`).join('')}</select>`+tbl(['Cidade','UF','Região'],S.cities.filter(c=>!u||c.uf==u).slice(0,300).map(c=>tr([esc(c.name),esc(c.uf),esc(c.region)])))},
cfg(){return`<div class="c"><h2>Empresa</h2><p>${esc(S.co.name)} · ${esc(S.name)} (${esc(S.role)})</p>${S.role=='proprietario'?`Capital inicial (R$)<input id="cap" type="number" value="${S.co.initial_capital}"><button onclick="salvaCap()">Salvar capital</button><h2 style="margin-top:16px">Custos de viagem (estimativa)</h2>Preço do diesel (R$/litro)<input id="dp" type="number" step="any" value="${(S.co.settings||{}).diesel_price??6}">Pedágio médio (R$/km)<input id="tk" type="number" step="any" value="${(S.co.settings||{}).toll_per_km??0}">Depreciação dos caminhões (% ao ano)<input id="dy" type="number" step="any" value="${(S.co.settings||{}).depr_year??10}"><button onclick="salvaSet()">Salvar custos</button>`:''}</div><button class="s" onclick="logout()">Sair da conta</button>`}};
const NAV=[['dash','Dashboard'],['ordens','Operações'],['frota','Frota'],['man','Manutenção'],['abs','Abastecimento'],['rh','Motoristas'],['fin','Financeiro'],['rel','Relatórios'],['cid','Cidades'],['eq','Equipe'],['cfg','Config']];
const ALL=['dash','ordens','frota','man','abs','rh','fin','rel','cid','eq','cfg'];
const ROLETABS={proprietario:ALL,administrador:ALL,gerente:['dash','ordens','frota','man','abs','rh','rel','cid','cfg'],financeiro:['dash','ordens','fin','rel','cfg'],motorista:['ordens','cfg']};
function render(){let h=location.hash.slice(1);const tabs=NAV.filter(([k])=>(ROLETABS[S.role]||[]).includes(k));if(!V[h]||!tabs.some(t=>t[0]==h))h=tabs[0]?tabs[0][0]:'cfg';
 $('#app').innerHTML=`<header><b>HLM <span>LOGISTICS</span></b><span style="margin-left:auto;color:#aaa;font-size:12px">${esc(S.name)}</span></header><nav>${tabs.map(([k,l])=>`<a href="#${k}" class="${k==h?'on':''}">${l}</a>`).join('')}</nav><main>${V[h]()}</main>`}
addEventListener('hashchange',()=>S.cid&&render());
boot();
</script></body></html>
