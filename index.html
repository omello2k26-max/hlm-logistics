<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>HLM LOGISTICS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0d0d0d;--sf:#1a1a1a;--bd:#2c2c2c;--tx:#f4f4f4;--mu:#9a9a9a;--or:#ff6a00;--ok:#3ecf8e;--er:#ff5c5c;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f5;--sf:#fff;--bd:#ddd;--tx:#111;--mu:#666;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:#000;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--or)}
header b{font-size:17px;letter-spacing:1px}header b span{color:var(--or)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--bd)}
nav a{color:var(--mu);text-decoration:none;padding:6px 12px;border-radius:16px;white-space:nowrap;border:1px solid var(--bd)}
nav a.on{background:var(--or);color:#000;border-color:var(--or);font-weight:600}
main{padding:12px;max-width:1000px;margin:auto}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.k small{color:var(--mu);display:block}.k b{font-size:18px;color:var(--or)}
button{background:var(--or);color:#000;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:4px 8px;font-weight:400}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;margin:3px 0 8px;font:inherit}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}h2{margin:0;font-size:16px}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--or);border-radius:10px;width:min(440px,92vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:#000a}.pos{color:var(--ok)}.neg{color:var(--er)}.mu{color:var(--mu)}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
</style></head><body>
<div id="app"></div><dialog id="dlg"></dialog>
<script>
const SB_URL='https://eynttevqytwhrvvqydpg.supabase.co',SB_KEY='sb_publishable_RnRiZhLDAdwaNEX2vobUJw_MhSdsXIU';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
let S={cities:[],vehicles:[],drivers:[],orders:[],fin:[],co:{},cid:null,role:'',name:''};
const R=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=s=>s?String(s).slice(0,10).split('-').reverse().join('/'):'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const tbl=(h,r)=>`<div class="w"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan="${h.length}" class="mu">Nenhum registro.</td></tr>`}</table></div>`;
const tr=c=>`<tr>${c.map(x=>`<td>${x}</td>`).join('')}</tr>`;
const ST={aguardando_carregamento:'Aguardando carregamento',aguardando_motorista:'Aguardando motorista',em_andamento:'Em andamento',em_pausa:'Em pausa',entregue:'Entregue',cancelada:'Cancelada',ocorrencia:'Ocorrência'};
const city=id=>{const c=S.cities.find(x=>x.id==id);return c?c.name+'/'+c.uf:'—'};
const err=e=>{if(e){alert('Erro: '+e.message);return true}return false};

/* ---------- login ---------- */
function showLogin(){$('#app').innerHTML=`<div id="login"><h2 style="font-size:24px;margin-bottom:16px">HLM <span style="color:var(--or)">LOGISTICS</span></h2><div class="c"><label>E-mail<input id="em" type="email" autocomplete="username"></label><label>Senha<input id="pw" type="password" autocomplete="current-password"></label><button onclick="login()" style="width:100%">Entrar</button><p id="le" class="neg"></p></div></div>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return $('#le').textContent='E-mail ou senha inválidos.';boot()}
async function logout(){await sb.auth.signOut();showLogin()}
async function boot(){
 const{data:{user}}=await sb.auth.getUser();if(!user)return showLogin();
 const{data:p,error}=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();
 if(error||!p){alert('Seu usuário não está vinculado a uma empresa.');return logout()}
 S.cid=p.company_id;S.role=p.role;S.name=p.display_name;await load();render()}
async function load(){
 const t=(n,o)=>{let q=sb.from(n).select('*');return o?q.order(o[0],{ascending:o[1]}):q};
 const r=await Promise.all([t('cities',['name',true]),t('vehicles',['code',true]),t('drivers',['name',true]),t('orders',['number',false]),t('fin_entries',['entry_date',false]),sb.from('companies').select('*').single()]);
 if(r.some(x=>err(x.error)))return;[S.cities,S.vehicles,S.drivers,S.orders,S.fin]=r.slice(0,5).map(x=>x.data);S.co=r[5].data}

/* ---------- formulário ---------- */
function form(title,fields,ok){
 const d=$('#dlg');
 d.innerHTML=`<div style="padding:14px"><h2>${title}</h2><br>${fields.map(([k,l,t,o])=>`<label>${l}${t=='sel'?`<select name="${k}">${o.map(([v,x])=>`<option value="${esc(v)}">${esc(x)}</option>`).join('')}</select>`:t=='area'?`<textarea name="${k}"></textarea>`:`<input name="${k}" type="${t||'text'}" step="any" value="${t=='date'?today():''}">`}</label>`).join('')}<div class="bar"><button class="s" id="x">Cancelar</button><button id="ok">Salvar</button></div></div>`;
 d.showModal();$('#x').onclick=()=>d.close();
 $('#ok').onclick=async()=>{const v={};for(const[k,l,t]of fields){let x=d.querySelector(`[name=${k}]`).value.trim();
  if(t=='number'){x=parseFloat(x);if(isNaN(x)||x<0)return alert(l+': informe um número válido')}else if(!x&&t!='area'&&t!='sel')return alert(l+' é obrigatório');
  v[k]=x===''?null:x}
  $('#ok').disabled=true;if(await ok(v)===false){$('#ok').disabled=false;return}d.close();await load();render()}}
async function ins(table,row){const{error}=await sb.from(table).insert({...row,company_id:S.cid});return !err(error)}
const opt=(a,f)=>[['','—'],...a.map(f)];

/* ---------- ações ---------- */
function novaOrdem(){
 if(S.cities.length<2)return alert('Cadastre ao menos 2 cidades na aba Cidades antes de criar ordens.');
 const cs=S.cities.map(c=>[c.id,c.name+'/'+c.uf]);
 form('Nova ordem de serviço',[['origin_id','Origem','sel',cs],['dest_id','Destino','sel',cs],['cargo_type','Tipo de mercadoria'],['weight_t','Peso (t)','number'],['freight_value','Valor do frete (R$)','number'],['distance_km','Distância (km)','number'],['vehicle_id','Caminhão','sel',opt(S.vehicles,v=>[v.id,v.code])],['driver_id','Motorista','sel',opt(S.drivers,d=>[d.id,d.name])],['trip_expenses','Despesas da viagem (R$)','number'],['status','Status inicial','sel',[['aguardando_carregamento',ST.aguardando_carregamento],['aguardando_motorista',ST.aguardando_motorista],['em_andamento',ST.em_andamento]]],['notes','Observações','area']],v=>ins('orders',v))}
async function mudaStatus(id,st){const{error}=await sb.from('orders').update({status:st}).eq('id',id);if(!err(error)){await load();render()}}
async function finalizar(id){if(!confirm('Finalizar entrega? Isso lança receita e despesas no financeiro.'))return;
 const{error}=await sb.from('orders').update({status:'entregue',delivered_at:new Date().toISOString()}).eq('id',id);if(!err(error)){await load();render()}}
async function cancelar(id){const j=prompt('Justificativa do cancelamento:');if(!j)return;
 let r=await sb.from('orders').update({status:'cancelada',cancel_reason:j}).eq('id',id);if(err(r.error))return;
 r=await sb.from('fin_entries').update({cancelled:true,cancel_reason:j}).eq('order_id',id);err(r.error);await load();render()}
const CR=['Fretes','Contratos','Serviços adicionais','Outros recebimentos'],CD=['Diesel','Pedágios','Salários','Manutenção','Pneus','Alimentação','Hospedagem','Financiamentos','Impostos fictícios','Multas','Outros gastos'];
const so=a=>a.map(x=>[x,x]);
function novoLanc(){form('Novo lançamento',[['kind','Tipo','sel',[['receita','Receita'],['despesa','Despesa']]],['category','Categoria','sel',so([...CR,...CD])],['description','Descrição'],['amount','Valor (R$)','number'],['entry_date','Data','date'],['sit','Situação','sel',[['pago','Pago/Recebido'],['pendente','Pendente']]]],v=>{const sit=v.sit;delete v.sit;return ins('fin_entries',{...v,paid_at:sit=='pago'?v.entry_date:null})})}
async function baixa(id){const{error}=await sb.from('fin_entries').update({paid_at:today()}).eq('id',id);if(!err(error)){await load();render()}}
async function cancLanc(id){const j=prompt('Justificativa:');if(!j)return;const{error}=await sb.from('fin_entries').update({cancelled:true,cancel_reason:j}).eq('id',id);if(!err(error)){await load();render()}}
function novoCam(){form('Novo caminhão',[['code','Identificador'],['brand','Marca'],['model','Modelo'],['year','Ano','number'],['odometer_km','Quilometragem','number'],['avg_consumption','Consumo médio (km/l)','number'],['acquisition_value','Valor de aquisição (R$)','number'],['status','Situação','sel',so(['disponivel','em_viagem','em_manutencao','financiado','vendido','inativo']).map(([v])=>[v,v.replace('_',' ')])]],v=>ins('vehicles',v))}
function novoMot(){form('Novo motorista',[['name','Nome / identificador'],['role_title','Cargo'],['salary','Salário (R$)','number'],['commission_pct','Comissão (%)','number'],['license_cat','Categoria CNH (simulação)']],v=>ins('drivers',v))}
function novaCid(){form('Nova cidade',[['name','Cidade'],['uf','UF'],['region','Região','sel',so(['Norte','Nordeste','Centro-Oeste','Sudeste','Sul'])]],v=>{v.uf=v.uf.toUpperCase().slice(0,2);return ins('cities',v)})}
function impCSV(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
 const rows=[];r.result.split(/\r?\n/).forEach((l,i)=>{const[c,u,g]=l.split(/[;,]/).map(x=>x.trim());if(!c||!u||u.length!=2||(i==0&&/cidade|nome/i.test(c)))return;rows.push({company_id:S.cid,name:c,uf:u.toUpperCase(),region:g||null})});
 const{error}=await sb.from('cities').upsert(rows,{onConflict:'company_id,name,uf',ignoreDuplicates:true});if(err(error))return;alert(rows.length+' linhas processadas');await load();render()};r.readAsText(f)}
async function salvaCap(){const v=parseFloat($('#cap').value);if(isNaN(v)||v<0)return alert('Valor inválido');const{error}=await sb.from('companies').update({initial_capital:v}).eq('id',S.cid);if(!err(error)){await load();render()}}

/* ---------- telas ---------- */
const act=()=>S.fin.filter(f=>!f.cancelled),sum=(a,k)=>a.filter(f=>f.kind==k).reduce((s,f)=>s+Number(f.amount),0);
const V={
dash(){const a=act(),p=a.filter(f=>f.paid_at),mes=today().slice(0,7),pm=p.filter(f=>f.entry_date.startsWith(mes));
 const fat=sum(pm,'receita'),dsp=sum(pm,'despesa'),saldo=Number(S.co.initial_capital||0)+sum(p,'receita')-sum(p,'despesa');
 const kp=[['Saldo atual',R(saldo)],['Faturamento do mês',R(fat)],['Despesas do mês',R(dsp)],['Lucro do mês',R(fat-dsp)],['Caminhões',S.vehicles.length],['Motoristas',S.drivers.length],['Em andamento',S.orders.filter(o=>o.status=='em_andamento').length],['Entregas concluídas',S.orders.filter(o=>o.status=='entregue').length],['A receber',R(sum(a.filter(f=>!f.paid_at),'receita'))],['A pagar',R(sum(a.filter(f=>!f.paid_at),'despesa'))]];
 const ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
 const dt=ms.map(m=>[sum(p.filter(f=>f.entry_date.startsWith(m)),'receita'),sum(p.filter(f=>f.entry_date.startsWith(m)),'despesa')]);const mx=Math.max(1,...dt.flat());
 const ch=dt.map((x,i)=>`<rect x="${i*50+8}" y="${100-x[0]/mx*90}" width="16" height="${x[0]/mx*90}" fill="#ff6a00"/><rect x="${i*50+26}" y="${100-x[1]/mx*90}" width="16" height="${x[1]/mx*90}" fill="#777"/><text x="${i*50+25}" y="114" font-size="9" fill="#999" text-anchor="middle">${ms[i].slice(5)}/${ms[i].slice(2,4)}</text>`).join('');
 return`<div class="g">${kp.map(([l,v])=>`<div class="c k"><small>${l}</small><b>${v}</b></div>`).join('')}</div><div class="c"><h2>Receitas <span style="color:#ff6a00">■</span> e despesas <span class="mu">■</span> (6 meses, efetivados)</h2><svg viewBox="0 0 300 120" width="100%">${ch}</svg></div><div class="c"><h2>Últimas movimentações</h2>${tbl(['Data','Descrição','Valor'],a.slice(0,6).map(f=>tr([D(f.entry_date),esc(f.description),`<span class="${f.kind=='receita'?'pos':'neg'}">${R(f.amount)}</span>`])))}</div>`},
ordens(){return`<div class="bar"><h2>Central de operações</h2><button onclick="novaOrdem()">+ Nova ordem</button></div>`+tbl(['Nº','Rota','Frete','Lucro','Status',''],S.orders.map(o=>{const v=S.vehicles.find(x=>x.id==o.vehicle_id),d=S.drivers.find(x=>x.id==o.driver_id),fim=['entregue','cancelada'].includes(o.status);
 return tr(['#'+o.number,city(o.origin_id)+' → '+city(o.dest_id)+`<br><small class="mu">${o.distance_km||0} km · ${esc(v?v.code:'sem caminhão')} · ${esc(d?d.name:'sem motorista')}</small>`,R(o.freight_value),R(o.freight_value-o.trip_expenses),ST[o.status]+(o.cancel_reason?`<br><small class="mu">${esc(o.cancel_reason)}</small>`:''),fim?'':(o.status!='em_andamento'?`<button class="s" onclick="mudaStatus('${o.id}','em_andamento')">Iniciar</button> `:'')+`<button class="s" onclick="finalizar('${o.id}')">Finalizar</button> <button class="s" onclick="cancelar('${o.id}')">Cancelar</button>`])}))},
frota(){return`<div class="bar"><h2>Frota</h2><button onclick="novoCam()">+ Caminhão</button></div>`+tbl(['ID','Veículo','Ano','Km','Consumo','Aquisição','Situação'],S.vehicles.map(t=>tr([esc(t.code),esc((t.brand||'')+' '+(t.model||'')),t.year||'',Number(t.odometer_km).toLocaleString('pt-BR'),(t.avg_consumption||'—')+' km/l',R(t.acquisition_value),t.status.replace('_',' ')])))},
rh(){return`<div class="bar"><h2>Motoristas</h2><button onclick="novoMot()">+ Motorista</button></div>`+tbl(['Nome','Cargo','Salário','Comissão','CNH','Entregas'],S.drivers.map(d=>tr([esc(d.name),esc(d.role_title),R(d.salary),d.commission_pct+'%',esc(d.license_cat),S.orders.filter(o=>o.driver_id==d.id&&o.status=='entregue').length])))},
fin(){const a=act(),p=a.filter(f=>f.paid_at);return`<div class="bar"><h2>Financeiro</h2><button onclick="novoLanc()">+ Lançamento</button></div><div class="g"><div class="c k"><small>Capital inicial</small><b>${R(S.co.initial_capital)}</b></div><div class="c k"><small>Receita efetivada</small><b>${R(sum(p,'receita'))}</b></div><div class="c k"><small>Despesa efetivada</small><b>${R(sum(p,'despesa'))}</b></div><div class="c k"><small>Resultado</small><b>${R(sum(p,'receita')-sum(p,'despesa'))}</b></div></div>`+tbl(['Data','Descrição','Categoria','Valor','Situação',''],S.fin.map(f=>tr([D(f.entry_date),esc(f.description),esc(f.category),`<span class="${f.kind=='receita'?'pos':'neg'}">${R(f.amount)}</span>`,f.cancelled?'Cancelado: '+esc(f.cancel_reason):f.paid_at?'Efetivado':'Pendente',f.cancelled?'':(f.paid_at?'':`<button class="s" onclick="baixa('${f.id}')">Baixar</button> `)+`<button class="s" onclick="cancLanc('${f.id}')">Cancelar</button>`])))},
cid(){const u=$('#uf')?$('#uf').value:'';return`<div class="bar"><h2>Cidades (${S.cities.length})</h2><button onclick="novaCid()">+ Cidade</button></div><div class="c">Importar CSV (cidade;UF;região)<input type="file" accept=".csv,.txt" onchange="impCSV(this)"></div><select id="uf" onchange="render()"><option value="">Todos os estados</option>${[...new Set(S.cities.map(c=>c.uf))].sort().map(x=>`<option ${u==x?'selected':''}>${x}</option>`).join('')}</select>`+tbl(['Cidade','UF','Região'],S.cities.filter(c=>!u||c.uf==u).slice(0,300).map(c=>tr([esc(c.name),esc(c.uf),esc(c.region)])))},
cfg(){return`<div class="c"><h2>Empresa</h2><p>${esc(S.co.name)} · ${esc(S.name)} (${esc(S.role)})</p>${S.role=='proprietario'?`Capital inicial (R$)<input id="cap" type="number" value="${S.co.initial_capital}"><button onclick="salvaCap()">Salvar capital</button>`:''}</div><button class="s" onclick="logout()">Sair da conta</button>`}};
const NAV=[['dash','Dashboard'],['ordens','Operações'],['frota','Frota'],['rh','Motoristas'],['fin','Financeiro'],['cid','Cidades'],['cfg','Config']];
function render(){let h=location.hash.slice(1);if(!V[h])h='dash';
 $('#app').innerHTML=`<header><b>HLM <span>LOGISTICS</span></b><span style="margin-left:auto;color:#aaa;font-size:12px">${esc(S.name)}</span></header><nav>${NAV.map(([k,l])=>`<a href="#${k}" class="${k==h?'on':''}">${l}</a>`).join('')}</nav><main>${V[h]()}</main>`}
addEventListener('hashchange',()=>S.cid&&render());
boot();
</script></body></html>
